<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Rhythm Training App — practice clapping rhythms and get instant feedback." />
  <title>Rhythm Trainer</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f1117" />
</head>
<body>

<header>
  <span class="logo">🥁</span>
  <h1>Rhythm Trainer</h1>
</header>

<main>

  <!-- ── Settings ── -->
  <section>
    <h2>Settings</h2>
    <div class="controls-row">

      <div class="field">
        <label for="bpm-input">Tempo (BPM)</label>
        <input type="number" id="bpm-input" value="80" min="20" max="300" step="1" />
      </div>

      <div class="field">
        <label for="threshold-slider">
          Mic Sensitivity
          <span class="hint">(lower = more sensitive)</span>
        </label>
        <div class="slider-row">
          <input type="range" id="threshold-slider" min="0.05" max="0.8" step="0.01" value="0.25" />
          <span id="threshold-val">0.25</span>
        </div>
      </div>

      <div class="field btn-field">
        <button id="start-btn"    class="btn btn-primary">▶ Start</button>
        <button id="playback-btn" class="btn btn-secondary" style="display:none">▶ Play Correct Rhythm</button>
        <button id="calibrate-btn" class="btn btn-ghost">🎯 Calibrate Mic</button>
      </div>

    </div>
    <div class="status-row">
      <p class="status-text" id="status-text">Select a rhythm below, set your BPM, then press Start.</p>
      <span id="offset-display" class="offset-display uncalibrated">Not calibrated</span>
    </div>
  </section>

  <!-- ── Rhythm library ── -->
  <section>
    <h2>Choose a Rhythm</h2>
    <div id="rhythm-selector"></div>
  </section>

  <!-- ── Notation + visualization ── -->
  <section>
    <h2>Notation</h2>

    <!-- Staff canvas — fills the section width -->
    <div class="staff-wrap">
      <canvas id="staff-canvas"></canvas>
    </div>

    <!-- Beat blocks — proportional-width colored bars as a quick reference -->
    <div class="blocks-label">Beat map</div>
    <div id="rhythm-blocks"></div>

    <!-- Countdown and live indicators -->
    <div id="countdown"></div>

    <div class="indicators">
      <div id="beat-indicator" class="hidden" title="Metronome beat">🎵</div>
      <span class="indicator-label hidden" id="beat-label">Beat</span>
      <div id="clap-indicator" class="hidden" title="Detected clap">👏</div>
      <span class="indicator-label hidden" id="clap-label">Clap detected</span>
    </div>
  </section>

  <!-- ── Results ── -->
  <section id="results-section" style="display:none">
    <h2>Your Results</h2>
    <div id="results"></div>
  </section>

</main>

<script type="module" src="js/app.js"></script>
</body>
</html>
